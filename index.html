<script>function startApp(){

var items=[];
try{items=JSON.parse(LS.getItem("kesim")||"[]")}catch(e){items=[]}
function save(){try{LS.setItem("kesim",JSON.stringify(items))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fd(d){if(!d)return"-";var p=d.split("-");return p[2]+"."+p[1]+"."+p[0]}
function status(i){if(!i.sentDate)return[0,"Kesildi"];if(i.backDate&&Number(i.backQty)>=Number(i.qty))return[2,"Tamamlandı"];if(i.backDate||Number(i.backQty)>0)return[1,"Kısmen geldi"];return[1,"Atölyede"]}
var app=document.getElementById("app");
function addClears(root){Array.prototype.forEach.call(root.querySelectorAll("input,textarea"),function(el){var t=el.type;if(el.readOnly||el.disabled||["checkbox","file","password","hidden","button"].indexOf(t)>-1)return;if(el.parentNode.classList.contains("cw"))return;var w=document.createElement("div");w.className="cw"+(el.tagName==="TEXTAREA"?" ta":"");el.parentNode.insertBefore(w,el);w.appendChild(el);var b=document.createElement("button");b.type="button";b.className="cx";b.textContent="×";b.setAttribute("aria-label","Temizle");w.appendChild(b);function sh(){b.style.display=(el.value||el.type==="date")?"block":"none"}sh();el.addEventListener("input",sh);el.addEventListener("change",sh);b.onclick=function(){var dt=el.type==="date";if(dt){el.blur();el.type="text";el.value="";el.type="date"}else{el.value=""}sh();el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}));if(!dt)el.focus()}})}
(function(){var d=Object.getOwnPropertyDescriptor(Element.prototype,"innerHTML");Object.defineProperty(app,"innerHTML",{get:function(){return d.get.call(this)},set:function(v){var ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&/^(q|mq|aq|gq|sq)$/.test(ae.id)&&this.querySelector("#"+ae.id)&&v.indexOf('id="'+ae.id+'"')>-1){var t=document.createElement("div");d.set.call(t,v);var nl=t.querySelector(".mlist"),ol=this.querySelector(".mlist"),nh=t.querySelector(".top h1"),oh=this.querySelector(".top h1");if(nl&&ol){ol.innerHTML=nl.innerHTML;if(nh&&oh)oh.textContent=nh.textContent;return}}d.set.call(this,v);addClears(this);enhanceSelects(this)},configurable:true})})();
function downloadBlob(name,blob){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000)}
function saveBlob(name,blob){try{var f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){return navigator.share({files:[f],title:name}).catch(function(e){if(e&&e.name==="AbortError")return;downloadBlob(name,blob)})}}catch(e){}downloadBlob(name,blob);return Promise.resolve()}
var dl={save:function(o){var b=(o.data instanceof Blob)?o.data:new Blob([o.data],{type:/\.pdf$/i.test(o.filename)?"application/pdf":"application/json"});return saveBlob(o.filename,b).then(function(){return{status:"saved"}})}};
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},Math.max(3000,t.length*80))}
function backupText(){return JSON.stringify({app:"kesim-takip",v:1,date:new Date().toISOString(),items:items,models:models,ateliers:ateliers,grams:grams,ships:ships},null,1)}
var cref=null;
(function(){try{Promise.all([claude.use("db"),claude.use("user")]).then(function(r){if(!r[0]||!r[1])return;return r[1].id().then(function(id){if(id)cref=r[0].collection("data/users/"+id).doc("backup")})}).catch(function(){})}catch(e){}})();
function fileExport(){
  var txt=backupText();
  if(dl){dl.save({filename:"kesim-yedek.json",data:txt}).then(function(){toast("Yedek kaydedildi")},function(e){if(!e||e.code!=="declined")sheet("export",txt)})}
  else sheet("export",txt);
}
function doImport(txt){
  var d;try{d=JSON.parse(txt)}catch(e){toast("Metin okunamadı");return}
  var a=Array.isArray(d)?d:(d&&d.items);
